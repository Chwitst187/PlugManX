###
# Custom Messaging File.
#
# Messaging uses MiniMessage hex colors in the form '<#RRGGBB>'.
# Make sure to include the single quotes around the custom messages.
# With new updates, this is subject to change and previous versions might not display information properly. Changes will be noted in the changelog.
###

prefix: '<#FF85C2>&lCHERRY <#555555>» '
check:
  header: '<#FFFFFF>Retrieving plugin versions...'
  not-found: '<#FFFFFF>Plugin not installed - latest available version is "{0}".'
  not-found-spigot: '<#FF4444>Could not fetch plugin data - does the plugin exist as a Spigot Resource?'
  out-of-date: '<#FF4444>Current version (<#FF4444>{0}<#FF4444>) does not match latest version (<#6BF18D>{1}<#FF4444>).'
  out-of-date-player: '<#FF4444>Might be Out-of-date (Installed -> Latest): {0}'
  up-to-date: '<#FFFFFF>Plugin seems to be up-to-date using version "{0}".'
  up-to-date-player: '<#6BF18D>Seems to be Up-to-date (Installed): {0}'
  file-done: '<#FFFFFF>File dump complete: {0}'
  unknown: '<#FF4444>Version information is unknown.'
  unknown-player: '<#FF4444>Unknown (Installed): {0}'
  not-available: '<#FF4444>Version information for {0} is unavailable.'
disable:
  all: '<#FFFFFF>All plugins have been disabled (excluding PlugMan).'
  already-disabled: '<#FF4444>{0} is already disabled.'
  disabled: '<#FFFFFF>{0} has been disabled.'
dump:
  dumped: '<#FFFFFF>Plugins dumped to {0}.'
  error: '<#FF4444>Could not dump to file.'
enable:
  all: '<#FFFFFF>All plugins have been enabled.'
  already-enabled: '<#FF4444>{0} is already enabled.'
  enabled: '<#FFFFFF>{0} has been enabled.'
error:
  ignored: '<#FF4444>PlugMan is configured to ignore that plugin.'
  invalid-plugin: '<#FF4444>That is not a valid plugin.'
  no-permission: '<#FF4444>I''m sorry, but you do not have permission to perform this command. Please contact the server administrators if you believe that this is in error.'
  specify-plugin: '<#FF4444>You must specify a plugin.'
  specify-command: '<#FF4444>You must specify a command.'
  paper-plugin: "<#FF4444>Paper plugins are currently not supported, I'm sorry."
  usage:
    command: '<#AAAAAA>- <#FFFFFF>Command: <#AAAAAA>{0}'
    description: '<#AAAAAA>- <#FFFFFF>Description: <#AAAAAA>{0}'
    usage: '<#AAAAAA>- <#FFFFFF>Usage: <#AAAAAA>{0}'
help:
  header: '<#AAAAAA>--------------------- [<#6BF18D> PlugMan <#AAAAAA>] ---------------------'
  help: '<#AAAAAA>- <#6BF18D>/{0} help <#FFFFFF>- <#AAAAAA>Displays this.'
  list: '<#AAAAAA>- <#6BF18D>/{0} list [-v] <#FFFFFF>- <#AAAAAA>List all plugins (-v shows versions).'
  dump: '<#AAAAAA>- <#6BF18D>/{0} dump <#FFFFFF>- <#AAAAAA>Dump plugin names and versions to file.'
  info: '<#AAAAAA>- <#6BF18D>/{0} info <plugin> <#FFFFFF>- <#AAAAAA>Get info on a plugin.'
  usage: '<#AAAAAA>- <#6BF18D>/{0} usage <plugin> <#FFFFFF>- <#AAAAAA>List commands a plugin has registered.'
  lookup: '<#AAAAAA>- <#6BF18D>/{0} lookup <command> <#FFFFFF>- <#AAAAAA>Find the plugin a command is registered to.'
  enable: '<#AAAAAA>- <#6BF18D>/{0} enable <plugin|all> <#FFFFFF>- <#AAAAAA>Enable a plugin.'
  disable: '<#AAAAAA>- <#6BF18D>/{0} disable <plugin|all> <#FFFFFF>- <#AAAAAA>Disable a plugin.'
  restart: '<#AAAAAA>- <#6BF18D>/{0} restart <plugin|all> <#FFFFFF>- <#AAAAAA>Restart a plugin.'
  load: '<#AAAAAA>- <#6BF18D>/{0} load <plugin> <#FFFFFF>- <#AAAAAA>Load a plugin.'
  reload: '<#AAAAAA>- <#6BF18D>/{0} reload <plugin|all> <#FFFFFF>- <#AAAAAA>Reload a plugin.'
  unload: '<#AAAAAA>- <#6BF18D>/{0} unload <plugin> <#FFFFFF>- <#AAAAAA>Unload a plugin.'
  check: '<#AAAAAA>- <#6BF18D>/{0} check <plugin|all> [-f] <#FFFFFF>- <#AAAAAA>Check if a plugin is up-to-date (-f dumps to file for all).'
info:
  header: 'Plugin Information: {0}'
  version: '<#AAAAAA>- Version: <#6BF18D>{0}'
  authors: '<#AAAAAA>- Author(s): <#6BF18D>{0}'
  status: '<#AAAAAA>- Status: {0}'
  depends: '<#AAAAAA>- Depends: {0}'
  softdepends: '<#AAAAAA>- SoftDepends: <#6BF18D>{0}'
list:
  list: '<#FFFFFF>Plugins ({0}): {1}'
load:
  already-loaded: '<#FF4444>{0} is already loaded.'
  cannot-find: '<#FF4444>Could not find file and failed to search descriptions.'
  invalid-description: '<#FF4444>That plugin has an invalid description.'
  invalid-plugin: '<#FF4444>That file is not a valid plugin.'
  loaded: '<#FFFFFF>{0} has been loaded and enabled.'
  plugin-dir: '<#FF4444>Plugin directory not found.'
lookup:
  found: '<#FFFFFF>/{0} is registered to {1}.'
  not-found: '<#FF4444>Command "/{0}" not registered in any plugin.yml'
reload:
  all: '<#FFFFFF>All plugins have been reloaded.'
  all-failed: '<#FF4444>Some plugins failed to reload: {0}'
  reloaded: '<#FFFFFF>{0} has been reloaded.'
restart:
  all: '<#FFFFFF>All plugins have been restarted.'
  restarted: '<#FFFFFF>{0} has been restarted.'
unload:
  failed: '<#FF4444>Failed to unload {0}.'
  gentle-failed: '<#FF4444>Plugin refused to unload.'
  unloaded: '<#FFFFFF>{0} has been unloaded.'
usage:
  usage: '<#FFFFFF>Commands: <#AAAAAA>{0}'
  no-commands: '<#FF4444>No commands registered.'
